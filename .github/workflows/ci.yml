name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Capture generated lockfile
        run: |
          echo 'LOCKFILE_BASE64_BEGIN'
          base64 -w 0 package-lock.json
          echo
          echo 'LOCKFILE_BASE64_END'

      - name: Audit dependencies
        run: npm audit --json || true

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
